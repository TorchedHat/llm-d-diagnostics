---
# Simulated prefill — inference-sim standing in for vLLM + GPU.
# Matches real topology: vllm-prefill-svc:8100
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-prefill
  labels:
    app: vllm-prefill
    app.kubernetes.io/part-of: vllm-disagg-sim
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-prefill
  template:
    metadata:
      labels:
        app: vllm-prefill
        app.kubernetes.io/part-of: vllm-disagg-sim
    spec:
      containers:
      - name: vllm
        image: ghcr.io/llm-d/llm-d-inference-sim:v0.10.2
        args:
        - "--port=8100"
        - "--model=$(MODEL_NAME)"
        - "--time-to-first-token=200ms"
        - "--inter-token-latency=50ms"
        - "--max-num-seqs=10"
        - "--max-model-len=4096"
        - "--v=2"
        envFrom:
        - configMapRef:
            name: vllm-model-config
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        ports:
        - containerPort: 8100
          name: http
          protocol: TCP
        resources:
          requests:
            cpu: "100m"
            memory: 128Mi
          limits:
            cpu: "500m"
            memory: 256Mi
        readinessProbe:
          httpGet:
            path: /health
            port: 8100
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 8100
          initialDelaySeconds: 10
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-prefill-svc
  labels:
    app: vllm-prefill
    app.kubernetes.io/part-of: vllm-disagg-sim
spec:
  clusterIP: None
  selector:
    app: vllm-prefill
  ports:
  - name: http
    port: 8100
    targetPort: 8100
    protocol: TCP
