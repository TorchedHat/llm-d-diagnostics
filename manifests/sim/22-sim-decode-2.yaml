---
# Simulated decode-2 — second decode instance.
# Matches real topology: vllm-decode-2-svc:8000 (sidecar), vllm on :8001
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-decode-2
  labels:
    app: vllm-decode-2
    app.kubernetes.io/part-of: vllm-disagg-sim
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-decode-2
  template:
    metadata:
      labels:
        app: vllm-decode-2
        app.kubernetes.io/part-of: vllm-disagg-sim
    spec:
      containers:
      - name: vllm
        image: ghcr.io/llm-d/llm-d-inference-sim:v0.11.2
        args:
        - "--port=8001"
        - "--model=$(MODEL_NAME)"
        - "--time-to-first-token=200ms"
        - "--inter-token-latency=50ms"
        - "--kv-cache-transfer-latency=3ms"
        - "--max-num-seqs=10"
        - "--max-model-len=4096"
        - "--v=2"
        envFrom:
        - configMapRef:
            name: vllm-model-config
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        ports:
        - containerPort: 8001
          name: vllm
          protocol: TCP
        resources:
          requests:
            cpu: "100m"
            memory: 128Mi
          limits:
            cpu: "500m"
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 10
          periodSeconds: 10
      - name: routing-sidecar
        image: ghcr.io/llm-d/llm-d-router-disagg-sidecar:v0.11.0
        args:
        - "--port=8000"
        - "--model-server-port=8001"
        - "--kv-connector=nixlv2"
        - "--secure-proxy=false"
        - "--zap-log-level=1"
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        resources:
          requests:
            cpu: "100m"
            memory: 128Mi
          limits:
            cpu: "500m"
            memory: 256Mi
        readinessProbe:
          httpGet:
            path: /v1/models
            port: 8000
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-decode-2-svc
  labels:
    app: vllm-decode-2
    app.kubernetes.io/part-of: vllm-disagg-sim
spec:
  clusterIP: None
  selector:
    app: vllm-decode-2
  ports:
  - name: http
    port: 8000
    targetPort: 8000
    protocol: TCP
