apiVersion: v1
kind: Pod
metadata:
  name: test-client
  labels:
    app: test-client
    app.kubernetes.io/part-of: vllm-disagg-sim
spec:
  containers:
  - name: python
    image: python:3.12-alpine
    command: ["sleep", "infinity"]
    envFrom:
    - configMapRef:
        name: vllm-model-config
    env:
    - name: NS
      valueFrom:
        fieldRef:
          fieldPath: metadata.namespace
    resources:
      requests:
        cpu: "500m"
        memory: 512Mi
      limits:
        cpu: "2"
        memory: 1Gi
  restartPolicy: Never
