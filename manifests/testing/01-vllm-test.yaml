apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-test
  labels:
    app: vllm-test
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vllm-test
  template:
    metadata:
      labels:
        app: vllm-test
    spec:
      resourceClaims:
      - name: gpu
        resourceClaimTemplateName: gpu-1
      containers:
      - name: vllm
        image: vllm/vllm-openai:v0.26.0
        command:
        - vllm
        - serve
        - $(MODEL_NAME)
        args:
        - --host
        - "0.0.0.0"
        - --port
        - "8000"
        - --dtype
        - $(DTYPE)
        - --gpu-memory-utilization
        - $(GPU_MEMORY_UTILIZATION)
        - --max-model-len
        - $(MAX_MODEL_LEN)
        - --tensor-parallel-size
        - "1"
        - --trust-remote-code
        env:
        - name: HF_HOME
          value: /model-cache/hf-cache
        envFrom:
        - configMapRef:
            name: vllm-model-config
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        resources:
          requests:
            cpu: "4"
            memory: 16Gi
          limits:
            cpu: "4"
            memory: 16Gi
          claims:
          - name: gpu
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 120
          periodSeconds: 30
          timeoutSeconds: 5
        volumeMounts:
        - name: model-cache
          mountPath: /model-cache
        - name: dshm
          mountPath: /dev/shm
      volumes:
      - name: model-cache
        persistentVolumeClaim:
          claimName: model-cache
      - name: dshm
        emptyDir:
          medium: Memory
      terminationGracePeriodSeconds: 30
